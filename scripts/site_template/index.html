<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">

  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="homepage.css"><link rel="stylesheet" href="site.css">
  <script defer src="articles.js"></script><script defer src="site.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="#home" aria-label="BPA 学习与操作中心首页"><span class="brand-mark" aria-hidden="true">B<span>↗</span></span><span>BPA <b>学习与操作中心</b></span></a>
    <nav aria-label="主导航"><a href="#home" data-nav="home">首页</a><a href="#learning" data-nav="learning">培训课程</a><a href="#guides" data-nav="guides">操作指南</a></nav>
    <button class="header-search" data-search aria-label="搜索知识库">⌕ <span>搜索</span><kbd>⌘ K</kbd></button>
  </div></header>
  <div class="prototype-note" id="preview-note"><span class="note-dot"></span>本地草稿预览<span class="note-divider">/</span>内容与配图待审核，非正式操作指引</div>
  <main id="main" tabindex="-1"></main>
  <footer class="site-footer"><span>BPA 学习与操作中心</span><span>流程管理平台培训与操作指南</span></footer>
  <dialog id="image-dialog" aria-label="查看图片">
    <div class="image-toolbar" role="group" aria-label="图片缩放控制">
      <button type="button" id="image-zoom-out" aria-label="缩小图片">−</button>
      <output id="image-zoom-label" aria-live="polite">适应窗口</output>
      <button type="button" id="image-zoom-in" aria-label="放大图片">＋</button>
      <button type="button" id="image-zoom-fit">适应窗口</button>
      <button type="button" class="image-close" aria-label="关闭图片">×</button>
    </div>
    <div class="image-viewport" id="image-viewport"><img id="image-preview" alt=""></div>
  </dialog>
  <dialog id="search-dialog" aria-labelledby="search-title">
    <div class="search-top"><label id="search-title" for="search-input">搜索知识内容</label><button class="icon-button" id="close-search" aria-label="关闭搜索">×</button></div>
    <div class="search-field"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="输入文章标题或正文关键词" autocomplete="off"></div>
    <div id="search-results" aria-live="polite"></div><div class="search-footer">标题与正文关键词查找 <span>Esc 关闭</span></div>
  </dialog>
</body>
</html>
